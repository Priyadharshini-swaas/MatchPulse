name: iOS CI/CD PoC

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: MatchPulse

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: MatchPulse

      - name: Build App
        run: bundle exec fastlane build_only
